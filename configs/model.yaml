# Model Architecture Configuration for Multi-Head Restoration Network

model:
  name: "MultiHeadNAFNet"
  in_channels: 1
  out_channels: 1
  scale_factor: 2

  # Encoder / Decoder channel widths and NAFBlock depths
  encoder_channels: [32, 64, 128]
  num_blocks: [2, 2, 4]

  # Head 2: Degradation Parameter Estimation (4 logged parameters from Phase 1)
  degradation_params:
    num_params: 4
    names:
      - "poisson_scale"
      - "gaussian_std"
      - "blur_ksize"
      - "downsample_scale"

  # Head 3: Log-Variance Uncertainty Map Clamping Limits
  uncertainty:
    min_log_variance: -10.0
    max_log_variance: 10.0
